<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispr E2EE Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container" id="app-container" style="display: none; opacity: 0;">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Whispr</h2>
                <div class="header-right">
                    <button id="theme-toggle" class="theme-toggle" title="Toggle Light/Dark Mode">
                        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    <span class="my-id-badge">ID: <span id="my-id">...</span></span>
                    <span class="status-dot"></span>
                </div>
                </div>
                <div class="new-chat-container">
                    <input type="text" id="new-chat-input" placeholder="Enter Username..." autocomplete="off">
                    <button id="btn-new-chat" title="New Chat">+</button>
                </div>

            <div class="chat-list" id="chat-list">
                <!-- Dynamic chat list items will appear here -->
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area" id="main-chat-area" style="display: none;">
            <div class="chat-header">
                <div>
                    <h3 id="chat-title">Chat</h3>
                    <p id="crypto-status" class="status-text text-muted">Connecting...</p>
                </div>
                <span class="badge" id="e2e-badge" style="opacity: 0.5;">Not Encrypted</span>
            </div>
            <div class="messages-container" id="messages">
                <!-- Messages will appear here -->
                <div class="message-wrapper system">
                    <div class="message system">
                        <span class="msg-content">End-to-End Encryption established.</span>
                    </div>
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="msg-input" placeholder="Type a secret message..." disabled autocomplete="off">
                <button id="btn-send" disabled>Send</button>
            </div>
        </main>
        
        <!-- Empty State (When no chat is selected) -->
        <main class="chat-area empty-state" id="empty-state">
            <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            <h3>Welcome to Whispr</h3>
            <p>Select a chat or start a new one.</p>
        </main>
    </div>

    <!-- Login/Register Modal -->
    <div class="auth-modal" id="auth-modal">
        <div class="auth-box">
            <h2>Welcome to Whispr</h2>
            <p class="auth-subtitle">Secure, Zero-Knowledge Messaging</p>
            
            <div id="auth-error" class="auth-error" style="display: none;"></div>
            
            <input type="text" id="auth-username" placeholder="Username" autocomplete="off">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="off">
            
            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Log In</button>
                <button id="btn-register" class="btn-secondary">Create Account</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
