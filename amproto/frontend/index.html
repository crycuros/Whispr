<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensayo E2EE Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Croppie CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- LOADING TOAST -->
    <div id="update-toast" class="update-toast" style="display: none;">
        <div class="spinner"></div> Updating...
    </div>

    <div class="app-container" id="app-container" style="display: none; opacity: 0;">

        <!-- NAV RAIL -->
        <nav class="nav-rail">
            <div class="nav-top">
                <button class="nav-logo" id="btn-logo" title="Mensayo">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M6 9 C 8 11, 8 13, 6 15" />
                        <path d="M11 5 C 15 9, 15 15, 11 19" />
                        <path d="M16 1 C 22 7, 22 17, 16 23" />
                    </svg>
                </button>
                <button class="nav-btn active" id="btn-chats" title="Chats">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <button class="nav-btn" id="btn-files" title="Files">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                </button>
                <button class="nav-btn" id="btn-contacts" title="Contacts">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </button>
            </div>
            <div class="nav-bottom">
                <button class="nav-btn" id="btn-notifications" title="Notifications">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
                <button class="nav-btn" id="btn-settings" title="Settings">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
                <div style="position: relative;">
                    <div class="nav-avatar" id="my-avatar" title="My Profile">?</div>
                    <div class="profile-popover" id="profile-popover" style="display: none;">
                        <button class="popover-item" id="btn-new-space">New Space</button>
                        <button class="popover-item" id="btn-new-feed">New Feed</button>
                        <div class="popover-divider"></div>
                        <button class="popover-item text-danger" id="btn-logout">Log Out</button>
                    </div>
                </div>
            </div>
        </nav>

        <!-- MESSAGES PANEL -->
        <aside class="messages-panel">
            <div class="panel-search">
                <input type="text" id="new-chat-input" placeholder="Search or start a new chat..." autocomplete="off">
                <button id="btn-new-chat" title="New Chat">+</button>
            </div>
            <div class="panel-section">
                <span>Messages</span>
                <button id="btn-filter" title="Filter">Filter ▾</button>
            </div>
            <div class="chat-list" id="chat-list">
                <!-- Dynamic chat list items will appear here -->
            </div>

            <!-- FEED CREATION PANEL -->
            <div class="side-panel" id="panel-new-feed">
                <div class="side-panel-header">
                    <button class="back-btn" id="btn-back-feed">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <h3>New Feed</h3>
                </div>
                <div class="side-panel-content">
                    <div class="avatar-uploader" id="feed-avatar-picker">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </div>
                    <input type="text" class="panel-input" id="feed-name" placeholder="Feed name" autocomplete="off">
                    <textarea class="panel-textarea" id="feed-desc" placeholder="Add a description to your Feed (optional)" rows="3"></textarea>
                </div>
                <button class="fab" id="btn-create-feed-fab" title="Create">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>

            <!-- SPACE CREATION - STEP 1 (ADD MEMBERS) -->
            <div class="side-panel" id="panel-space-step1">
                <div class="side-panel-header">
                    <button class="back-btn" id="btn-back-space1">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <h3>Add Members</h3>
                </div>
                <div class="side-panel-content no-padding">
                    <div class="panel-search">
                        <input type="text" placeholder="Search contacts..." autocomplete="off">
                    </div>
                    <div class="group-members" id="space-member-list"></div>
                </div>
                <button class="fab" id="btn-space-next" title="Next">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
            </div>

            <!-- SPACE CREATION - STEP 2 (DETAILS) -->
            <div class="side-panel" id="panel-space-step2">
                <div class="side-panel-header">
                    <button class="back-btn" id="btn-back-space2">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    </button>
                    <h3>New Space</h3>
                </div>
                <div class="side-panel-content">
                    <div class="avatar-uploader" id="space-avatar-picker">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                    </div>
                    <input type="text" class="panel-input" id="space-name" placeholder="Space name" autocomplete="off">
                    <textarea class="panel-textarea" id="space-desc" placeholder="Add a description to your Space (optional)" rows="3"></textarea>
                    
                    <div class="selected-members-section">
                        <h4>Selected Members</h4>
                        <div id="space-selected-members"></div>
                    </div>
                </div>
                <button class="fab" id="btn-create-space-fab" title="Create">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
            </div>
        </aside>

        <!-- CHAT AREA -->
        <main class="chat-area" id="main-chat-area" style="display: none;">
            <header class="chat-header">
                <div class="header-avatar" id="header-avatar">?</div>
                <div class="header-info">
                    <h3 id="chat-title">Chat</h3>
                    <p id="crypto-status" class="status-text text-muted">Connecting...</p>
                </div>
                <div class="header-actions">
                    <button class="ghost-btn" id="btn-pin" title="Pin"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16.5l-6-6V4h1V2H8v2h1v6.5l-6 6v1.5h7.5v6l1.5 1.5 1.5-1.5v-6H21z"></path></svg></button>
                    <button class="ghost-btn" id="btn-edit" title="Edit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
                    <button class="ghost-btn" id="btn-share" title="Share"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg></button>
                </div>
            </header>
            <div class="messages-container" id="messages"></div>
            <div class="input-area">
                <button class="mic-btn" id="btn-mic" title="Voice message"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line></svg></button>
                <input type="text" id="msg-input" placeholder="Write a message..." disabled autocomplete="off">
                <button id="btn-send" disabled title="Send"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
            </div>
        </main>

        <!-- EMPTY STATE -->
        <main class="chat-area empty-state" id="empty-state">
            <div class="empty-logo">
                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                    <path d="M6 9 C 8 11, 8 13, 6 15" />
                    <path d="M11 5 C 15 9, 15 15, 11 19" />
                    <path d="M16 1 C 22 7, 22 17, 16 23" />
                </svg>
            </div>
            <h3>Welcome to Mensayo</h3>
            <p>Select a chat or start a new one.</p>
        </main>
    </div>

    <!-- LOGIN / REGISTER MODAL -->
    <div class="modal-overlay" id="auth-modal">
        <div class="auth-box">
            <div class="auth-logo">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round">
                    <path d="M6 9 C 8 11, 8 13, 6 15" />
                    <path d="M11 5 C 15 9, 15 15, 11 19" />
                    <path d="M16 1 C 22 7, 22 17, 16 23" />
                </svg>
            </div>
            <h2>Welcome to Mensayo</h2>
            <p class="auth-subtitle">Secure, Zero-Knowledge Messaging</p>
            <div id="auth-error" class="auth-error" style="display: none;"></div>
            <input type="text" id="auth-username" placeholder="Username" autocomplete="off">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="off">
            <div class="auth-buttons">
                <button id="btn-login" class="btn-primary">Log In</button>
                <button id="btn-register" class="btn-secondary">Create Account</button>
            </div>
        </div>
    </div>

    <!-- CROP MODAL -->
    <div class="modal-overlay" id="crop-modal" style="display: none; z-index: 20000;">
        <div class="crop-container" style="background: var(--sidebar); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: var(--shadow-lg); width: 90%; max-width: 440px;">
            <h3 style="margin: 0; color: var(--text-primary);">Crop Photo</h3>
            <div id="croppie-container" style="width: 100%; height: 300px; position: relative;"></div>
            <div class="auth-buttons" style="width: 100%;">
                <button id="btn-apply-crop" class="btn-primary">Apply</button>
                <button id="btn-cancel-crop" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Croppie JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/croppie/2.6.5/croppie.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
